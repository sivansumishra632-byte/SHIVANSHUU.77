<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHREE JI FAST FOOD Billing Pro</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0}
.header{background:#ff6b00;color:#fff;padding:14px;text-align:center;font-size:24px;font-weight:bold}
.wrap{max-width:1000px;margin:auto;padding:12px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px}
input,select,button{padding:10px;margin:4px 0}
select,input{width:100%;box-sizing:border-box}
button{border:none;border-radius:8px;background:#ff6b00;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
.small{width:auto}
@media print{
body *{visibility:hidden}
#receipt,#receipt *{visibility:visible}
#receipt{position:absolute;left:0;top:0;width:58mm}
}
</style>
</head>
<body>
<div class="header">SHREE JI FAST FOOD - BILLING PRO</div>

<div class="wrap">
<div class="card">
<input id="customer" placeholder="Customer Name (Optional)">

<select id="item">
<option value="30">Chowmein Half ₹30</option>
<option value="60">Chowmein Full ₹60</option>
<option value="30">Fried Rice Half ₹30</option>
<option value="60">Fried Rice Full ₹60</option>
<option value="30">French Fries Half ₹30</option>
<option value="60">French Fries Full ₹60</option>
<option value="30">Momos Half ₹30</option>
<option value="60">Momos Full ₹60</option>
<option value="25">Spring Roll ₹25</option>
<option value="30">Burger ₹30</option>
<option value="50">Paneer Burger ₹50</option>
<option value="50">Dosa ₹50</option>
<option value="70">Masala Dosa ₹70</option>
<option value="90">Paneer Dosa ₹90</option>
<option value="50">Pav Bhaji ₹50</option>
<option value="90">Chilli Paneer Half ₹90</option>
<option value="170">Chilli Paneer Full ₹170</option>
<option value="70">Chilli Potato Half ₹70</option>
<option value="130">Chilli Potato Full ₹130</option>
</select>

<input type="number" id="qty" value="1" min="1">

<button onclick="addItem()">➕ Add Item</button>
</div>

<div class="card">
<table id="billTable">
<tr><th>Item</th><th>Qty</th><th>Amt</th><th>Del</th></tr>
</table>

<h3>Total ₹ <span id="total">0</span></h3>

<input id="discount" type="number" value="0" placeholder="Discount">
<button onclick="applyDiscount()">Apply Discount</button>

<button onclick="saveBill()">💾 Save Bill</button>
<button onclick="printBill()">🖨 Print Bill</button>
</div>

<div class="card">
<h3>Today's Saved Bills</h3>
<div id="history"></div>
</div>

<div id="receipt"></div>
</div>

<script>
let items=[];
let total=0;

function updateTotal(){
 document.getElementById("total").innerText=total;
}

function addItem(){
 let s=document.getElementById("item");
 let name=s.options[s.selectedIndex].text;
 let price=parseInt(s.value);
 let qty=parseInt(document.getElementById("qty").value)||1;
 let amt=price*qty;

 let obj={name,qty,amt};
 items.push(obj);

 let row=document.getElementById("billTable").insertRow(-1);
 row.insertCell(0).innerText=name;
 row.insertCell(1).innerText=qty;
 row.insertCell(2).innerText=amt;

 let d=row.insertCell(3);
 let btn=document.createElement("button");
 btn.innerText="X";
 btn.onclick=function(){
   total-=amt;
   row.remove();
   updateTotal();
 };
 d.appendChild(btn);

 total+=amt;
 updateTotal();
}

function applyDiscount(){
 let dis=parseInt(document.getElementById("discount").value)||0;
 total=Math.max(0,total-dis);
 updateTotal();
}

function saveBill(){
 let data=JSON.parse(localStorage.getItem("sjBills")||"[]");
 data.push({
   bill:"SJ"+Date.now().toString().slice(-6),
   total:total,
   date:new Date().toLocaleString()
 });
 localStorage.setItem("sjBills",JSON.stringify(data));
 loadHistory();
 alert("Bill Saved");
}

function loadHistory(){
 let data=JSON.parse(localStorage.getItem("sjBills")||"[]");
 let h="";
 data.slice().reverse().forEach(b=>{
   h+="<div>"+b.bill+" | ₹"+b.total+" | "+b.date+"</div>";
 });
 document.getElementById("history").innerHTML=h;
}

function printBill(){
 let billNo="SJ"+Date.now().toString().slice(-6);
 let customer=document.getElementById("customer").value || "-";

 let r="<h3>SHREE JI FAST FOOD</h3>";
 r+="Bill No: "+billNo+"<br>";
 r+="Customer: "+customer+"<br>";
 r+=new Date().toLocaleString()+"<hr>";

 items.forEach(i=>{
   r+=i.name+" x"+i.qty+" ₹"+i.amt+"<br>";
 });

 r+="<hr><b>Total ₹"+total+"</b><hr>";
 r+="UPI: 6386476348@ybl<br>";
 r+="Scan & Pay QR (Replace with your QR image later)<br>";
 r+="Thank You Visit Again";

 document.getElementById("receipt").innerHTML=r;
 window.print();
}

loadHistory();
</script>
</body>
</html>
