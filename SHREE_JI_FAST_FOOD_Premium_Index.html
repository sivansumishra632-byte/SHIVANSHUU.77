!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHREE JI FAST FOOD Billing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;padding:15px}
.container{max-width:700px;margin:auto;background:#fff;padding:15px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
h1{text-align:center;color:#ff6b00;margin-bottom:15px}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{background:#ff6b00;color:#fff;border:none;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
.summary{margin-top:15px;font-size:18px;font-weight:bold}
.dashboard{margin-top:15px;padding:12px;background:#fff3e8;border-radius:10px}
.billCard{background:#fafafa;padding:10px;margin-top:8px;border-radius:8px;border-left:4px solid #ff6b00}
@media print{
body *{visibility:hidden}
#printBill,#printBill *{visibility:visible}
#printBill{position:absolute;left:0;top:0;width:58mm;font-size:12px}
}
</style>
</head>
<body>
<div class="container">
<h1>SHREE JI FAST FOOD</h1>
<input type="text" id="customer" placeholder="Customer Name">
<select id="item">
<option value="30">Chowmein ₹30</option>
<option value="60">Chowmein Full ₹60</option>
<option value="30">Fried Rice ₹30</option>
<option value="60">Fried Rice Full ₹60</option>
<option value="30">French Fries ₹30</option>
<option value="60">French Fries Full ₹60</option>
<option value="30">Momos ₹30</option>
<option value="60">Momos Full ₹60</option>
<option value="25">Spring Roll ₹25</option>
<option value="30">Burger ₹30</option>
<option value="50">Paneer Burger ₹50</option>
<option value="50">Dosa ₹50</option>
<option value="70">Masala Dosa ₹70</option>
<option value="90">Paneer Dosa ₹90</option>
<option value="50">Pav Bhaji ₹50</option>
<option value="90">Chilli Paneer Half ₹90</option>
<option value="170">Chilli Paneer Full ₹170</option>
<option value="70">Chilli Potato Half ₹70</option>
<option value="130">Chilli Potato Full ₹130</option>
</select>
<input type="number" id="qty" value="1" min="1">
<button onclick="addItem()">Add Item</button>
<table><thead><tr><th>Item</th><th>Qty</th><th>Amt</th></tr></thead><tbody id="billBody"></tbody></table>
<div class="summary">Total: ₹<span id="total">0</span></div>
<button onclick="saveBill()">Save Bill</button>
<button onclick="printReceipt()">Print Bill</button>
<div class="dashboard">
<h3>Today's Dashboard</h3>
<p>Total Sales: ₹<span id="sales">0</span></p>
<p>Total Orders: <span id="orders">0</span></p>
</div>
<div><h3>Bill History</h3><div id="history"></div></div>
</div>
<div id="printBill" style="display:none"></div>
<script>
let billItems=[],total=0;
function addItem(){
let item=document.getElementById("item"),qty=parseInt(document.getElementById("qty").value);
let name=item.options[item.selectedIndex].text,rate=parseInt(item.value),amount=rate*qty;
billItems.push({name,qty,amount}); total+=amount;
document.getElementById("billBody").innerHTML += `<tr><td>${name}</td><td>${qty}</td><td>₹${amount}</td></tr>`;
document.getElementById("total").innerText=total;
}
function saveBill(){
if(total===0){alert("Add items first");return;}
let customer=document.getElementById("customer").value||"Walk In";
let bill={id:Date.now(),customer,total,date:new Date().toLocaleString()};
let bills=JSON.parse(localStorage.getItem("bills"))||[];
bills.push(bill); localStorage.setItem("bills",JSON.stringify(bills));
loadDashboard(); loadHistory(); alert("Bill Saved");
billItems=[]; total=0;
document.getElementById("billBody").innerHTML="";
document.getElementById("total").innerText="0";
document.getElementById("customer").value="";
}
function loadDashboard(){
let bills=JSON.parse(localStorage.getItem("bills"))||[],sales=0;
bills.forEach(b=>sales+=b.total);
document.getElementById("sales").innerText=sales;
document.getElementById("orders").innerText=bills.length;
}
function loadHistory(){
let bills=JSON.parse(localStorage.getItem("bills"))||[];
document.getElementById("history").innerHTML=bills.reverse().map(b=>`<div class="billCard"><b>${b.customer}</b><br>₹${b.total}<br>${b.date}</div>`).join('');
}
function printReceipt(){
let customer=document.getElementById("customer").value||"Walk In";
let receipt=`<center><b>SHREE JI FAST FOOD</b><br>Customer: ${customer}<br>${new Date().toLocaleString()}<br><hr>`;
billItems.forEach(i=>receipt+=`${i.name}<br>${i.qty} x = ₹${i.amount}<br>`);
receipt+=`<hr><b>Total: ₹${total}</b><br>Thank You Visit Again</center>`;
let div=document.getElementById("printBill");
div.innerHTML=receipt; div.style.display="block"; window.print(); div.style.display="none";
}
loadDashboard(); loadHistory();
</script>
</body></html>
